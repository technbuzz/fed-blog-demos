<main class="main">
  <section class="content">
  <table>
    <thead tnb-sort (sortChange)="updateSort($event)">
      <th sort-header="post-id">Post ID </th>
      <th>Name</th>
      <th sort-header="email"> Email </th>
      <th>Body</th>
    </thead>
    <tbody>
      @for(item of comments.value(); track $index) {
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.name | slice: 0: 20 }}</td>
          <td class="normal">{{ item.email }}</td>
          <td>{{ item.body | slice: 0: 50 }}</td>
        </tr>
      }
    </tbody>
  </table>

  </section>


</main>

<router-outlet />
